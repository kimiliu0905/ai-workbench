name: Desktop packages

on:
  push:
    branches: ["codex/workbench-delivery"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: file:./build.db
      APP_SECRET: isolated-release-build-secret
      STORAGE_ROOT: ./build-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test
      - run: npm run lint
      - run: npm run prisma:migrate
      - run: npm run check:agent-driver
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist:all-win
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          sudo sysctl -w kern.maxfiles=262144 kern.maxfilesperproc=131072
          ulimit -n 65536
          npm run dist:mac
      - name: Verify bundled server and native modules
        run: npm run smoke:desktop
      - name: Install Windows package and verify its desktop UI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist-desktop/YezijianWorkbench-*-windows-x64.exe" | Select-Object -First 1
          if (!$installer) { throw "Windows installer missing" }
          $installDir = Join-Path $env:RUNNER_TEMP "YezijianInstalled"
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS returned $($result.ExitCode)" }
          $env:WORKBENCH_MIGRATION_VOLUME = $env:RUNNER_TEMP
          node tests/browser/workbench-desktop.cjs (Join-Path $installDir "YezijianWorkbench.exe")
      - name: Verify packaged macOS desktop UI
        if: runner.os == 'macOS'
        run: node tests/browser/workbench-desktop.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-output/workbench/
          if-no-files-found: ignore
          retention-days: 30
      - name: Record package hashes
        shell: bash
        run: |
          cd dist-desktop
          if command -v sha256sum >/dev/null; then hash=(sha256sum); else hash=(shasum -a 256); fi
          "${hash[@]}" YezijianWorkbench-*-${{ matrix.platform }}-${{ matrix.arch }}.* > SHA256SUMS-${{ matrix.platform }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-desktop/YezijianWorkbench-*-${{ matrix.platform }}-${{ matrix.arch }}.exe
            dist-desktop/YezijianWorkbench-*-${{ matrix.platform }}-${{ matrix.arch }}.zip
            dist-desktop/SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
